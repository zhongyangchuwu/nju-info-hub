name: Container

on:
  pull_request:
    paths:
      - '.github/workflows/container.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'scripts/**'
      - 'apps/**'
      - 'packages/**'
      - 'sources/**'
      - 'instances/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/container.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'scripts/**'
      - 'apps/**'
      - 'packages/**'
      - 'sources/**'
      - 'instances/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical Compose
        env:
          NJU_INFO_IMAGE: ghcr.io/zhongyangchuwu/nju-info-hub:sha-1234567
        run: docker compose -f compose.yaml config >/dev/null
      - name: Build local image
        run: |
          docker build \
            --build-arg VERSION=dev \
            --build-arg REVISION="$GITHUB_SHA" \
            --tag nju-info-hub:ci \
            .
      - name: Smoke container
        run: bash scripts/docker-smoke.sh nju-info-hub:ci
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build arm64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg VERSION=dev \
            --build-arg REVISION="$GITHUB_SHA" \
            .

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zhongyangchuwu/nju-info-hub
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            REVISION=${{ github.sha }}
