    <p>各位同学：</p>
    <p>现根据医保有关部门通知，校医院将统一收取2025年度医保未报销的就医费用发票，代交至南京市医保中心进行零星报销处理，请于2026年3月31日之前提交报销材料。具体通知如下：</p>
    <p>具体办理时间地点如下：</p>
    <p>鼓楼校医院 421室 周一（8：00-11：45,13:30-17:00，节假日除外）</p>
    <p>仙林校医院 214室 周二（8：00-11：45,13:30-17:00，节假日除外）</p>
    <p>浦口校医院二楼办公室 周三（9:00-11:30，节假日除外）</p>
    <p>苏州校区门诊部 周二（8:00-11:30,13:30-17:00，节假日除外）</p>
