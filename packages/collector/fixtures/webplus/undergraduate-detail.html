      <p class="arti_metas"><span class="arti_publisher">发布者：本科生院教育教学发展与评估中心</span><span class="arti_update">发布时间：2026-09-07</span></p>
      <div class="entry"><div class="read"><div class="wp_articlecontent">
        <p>各位2026级本科新生：</p>
        <p>欢迎开启悦读之旅！阅读能力培育与阅读习惯养成，是南京大学通识教育的重要组成部分。</p>
        <p>请新生通过统一身份认证登录“悦读经典数智平台”（<a href="https://yunshu.njupco.com/yuedu">https://yunshu.njupco.com/yuedu</a>），在首页“课程中心”选择本学期想学习的悦读模块。</p>
        <p>本科生院</p>
