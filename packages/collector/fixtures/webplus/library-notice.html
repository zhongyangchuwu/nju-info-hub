      <h3>图书馆关于暑假开放时间的通知</h3>
      <div class="time">发布时间：2026.07.09 来源：</div>
    </div>
    <div class="artical">
      <div id="vsb_content">
        <div class="v_news_content">
          <p style="text-indent:37px">根据《南京大学办公室关于2026年暑假和暑期学校工作安排的通知》精神，为确保满足广大读者教学科研及学习需求，图书馆各校区分馆暑假期间（2026年7月13日—8月19日，8月20日起恢复正常开放时间）具体开放安排如下：</p>
          <table cellspacing="0" cellpadding="0">
            <tbody>
              <tr><th>开放区域</th><th>开放时间</th><th>注意事项</th></tr>
              <tr><td>图书借阅区、报刊阅览区、工具书阅览区</td><td>每周一至周日 9:00—17:00</td><td>总服务台合并至报刊阅览区开放</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
