services:
  api:
    image: ${NJU_INFO_IMAGE:?Set NJU_INFO_IMAGE to an immutable GHCR tag or local image}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NJU_INFO_PORT:-3000}:3000"
    volumes:
      - nju-info-data:/data:ro

  collect:
    image: ${NJU_INFO_IMAGE:?Set NJU_INFO_IMAGE to an immutable GHCR tag or local image}
    profiles: ["collect"]
    command: ["collect"]
    volumes:
      - nju-info-data:/data

volumes:
  nju-info-data:
