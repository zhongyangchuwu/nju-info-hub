services:
  scheduler:
    image: ${NJU_INFO_IMAGE:?Set NJU_INFO_IMAGE to an immutable GHCR tag or local image}
    restart: unless-stopped
    command: ["schedule"]
    environment:
      NJU_INFO_CONFIG: /config/instance.json
      NJU_INFO_READY_FILE: /data/.collection-ready
    volumes:
      - nju-info-data:/data
      - ${NJU_INFO_CONFIG_FILE:-../../../instances/official.json}:/config/instance.json:ro
    healthcheck:
      disable: true

  api:
    image: ${NJU_INFO_IMAGE:?Set NJU_INFO_IMAGE to an immutable GHCR tag or local image}
    restart: unless-stopped
    depends_on:
      scheduler:
        condition: service_started
    ports:
      - "127.0.0.1:${NJU_INFO_PORT:-3000}:3000"
    environment:
      NJU_INFO_READY_FILE: /data/.collection-ready
      NJU_INFO_READY_TIMEOUT_SECONDS: ${NJU_INFO_READY_TIMEOUT_SECONDS:-900}
    volumes:
      - nju-info-data:/data

  collect:
    image: ${NJU_INFO_IMAGE:?Set NJU_INFO_IMAGE to an immutable GHCR tag or local image}
    profiles: ["collect"]
    command: ["collect"]
    environment:
      NJU_INFO_CONFIG: /config/instance.json
    volumes:
      - nju-info-data:/data
      - ${NJU_INFO_CONFIG_FILE:-../../../instances/official.json}:/config/instance.json:ro

volumes:
  nju-info-data:
