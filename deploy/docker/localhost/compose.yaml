services:
  api:
    image: ${NJU_INFO_IMAGE:?Set NJU_INFO_IMAGE to an immutable GHCR tag or local image}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NJU_INFO_PORT:-3000}:3000"
    volumes:
      - nju-info-data:/data

  collect:
    image: ${NJU_INFO_IMAGE:?Set NJU_INFO_IMAGE to an immutable GHCR tag or local image}
    profiles: ["collect"]
    command: ["collect"]
    environment:
      NJU_INFO_CONFIG: /config/instance.json
    volumes:
      - nju-info-data:/data
      - ${NJU_INFO_CONFIG_FILE:-../../../instances/official.json}:/config/instance.json:ro

volumes:
  nju-info-data:
